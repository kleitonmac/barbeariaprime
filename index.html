    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f59e0b;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 18px;
        font-weight: 600;
        color: #f59e0b;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Carregando Barbearia Novo Estilo...</div>
    </div>

    <div id="root"></div>
    
    <script type="module">
      // Show loading screen
      const loadingScreen = document.getElementById('loading-screen');
      const root = document.getElementById('root');
      
      // Handle redirects for SPA
      (function() {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
      
      // Load the app
      import('./src/main.tsx')
        .then(() => {
          loadingScreen.style.display = 'none';
        })
        .catch(error => {
          console.error('Error loading application:', error);
          loadingScreen.innerHTML = `
            <div style="text-align: center; padding: 20px;">
              <div style="color: #ef4444; font-size: 48px; margin-bottom: 20px;">⚠️</div>
              <h2 style="color: #f59e0b; margin-bottom: 10px;">Erro ao carregar</h2>
              <p style="color: #d1d5db; margin-bottom: 20px;">Ocorreu um erro ao carregar a aplicação.</p>
              <button onclick="location.reload()" style="background: #f59e0b; color: black; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
                Tentar Novamente
              </button>
            </div>
          `;
        });
    </script>
